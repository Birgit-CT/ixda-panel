<script>
/* =====================================================================
   KONFIGURASJON – dette er den eneste delen dere trenger å endre.
   Se README.md for steg-for-steg-oppsett.
   ===================================================================== */
const CONFIG = {
  title: "Studentene spør – bransjen svarer",
  subtitle: "IxDA Bergen",

  // Lenken folk skal til når de scanner QR-koden (Google Skjema-lenken).
  formUrl: "https://docs.google.com/forms/d/e/1FAIpQLScgAer6rbLUIIv5NPM5VbgXUCQLxkRkb7WJzuHxUXHpaNEi_Q/viewform?usp=dialog",
  // Valgfri kort lenke som vises under QR-koden (f.eks. forms.gle/abc123).
  shortUrl: "https://forms.gle/tRd1iNW4KvLH4z1v5",

  // Regnearket som skjemaet lagrer svar i. ID-en er den lange koden i lenken:
  // https://docs.google.com/spreadsheets/d/  >>DENNE-DELEN<<  /edit
  // Regnearket må deles som «Alle som har linken kan se».
  sheetId: "1QgHe1P05UJEVXVvdYC7gs9S4uS3gwsNBQ1bXLEAT208",
  // Navnet på fanen nederst i regnearket (norsk Google: «Skjemasvar 1»).
  sheetName: "Skjemasvar 1",

  // VALGFRITT, for raskest mulig oppdatering: lenken til et Apps Script (se README, «Raskere oppdatering»).
  // Når denne er fylt inn, hentes svarene direkte fra regnearket uten Googles mellomlagring.
  scriptUrl: "",

  // Spørsmålet i skjemaet der folk velger hvem de er (må stå likt i skjemaet).
  roleQuestion: "Hvem er du?",
  // Gruppene. «match» er et ord som finnes i svaralternativet i skjemaet.
  // «shape» er formen gruppen vises med: "circle", "square", "triangle", "diamond".
  groups: [
    { label: "Student / jobbsøker", match: "student",   shape: "circle" },
    { label: "Konsulenthus", match: "konsulent", shape: "square" },
    { label: "Inhouse",      match: "inhouse",   shape: "triangle" },
    { label: "Andre",        match: "andre",     shape: "diamond" }
  ],

  // Skalaen. Bruk «Lineær skala» 1–5 i Google Skjema.
  scale: { min: 1, max: 5, labels: ["Helt uenig", "Uenig", "Nøytral", "Enig", "Helt enig"] },

  // Utsagnene – må stå likt (eller nesten likt) som spørsmålene i skjemaet.
  statements: [
    "En sterk portefølje betyr mer enn karakterer og utdanning.",
    "AI kommer til å redusere behovet for juniordesignere.",
    "Det lønner seg å spesialisere seg tidlig fremfor å være generalist.",
    "Praksisplass eller sommerjobb er viktigere enn masteroppgaven.",
    "Utdanningen forbereder studentene godt på arbeidslivet.",
    "2027 er et godt tidspunkt å utdanne seg til designer."
  ],

  // Fritekstspørsmålet for spørsmål fra salen. Skjermen finner kolonnen som inneholder dette ordet.
  questionColumn: "spørsmål",

  // Hvor ofte skjermen henter nye svar (sekunder).
  refreshSeconds: 3
};
</script>
<style>
  :root {
    color-scheme: dark;
    --surface-0: #08141e;
    --surface-1: #0f1d2c;
    --surface-2: #17273a;
    --border: #213249;
    --grid: #1d2d40;
    --text-primary: #eef1fb;
    --text-secondary: #c2cad8;
    --text-muted: #8a97ab;
    --accent: #eef1fb;
    --g1: #3987e5;  /* Deltaker – blå */
    --g2: #d95926;  /* Konsulenthus – oransje */
    --g3: #199e70;  /* Inhouse – aqua */
    --g4: #d6a000;  /* Andre – gul */
    --font-display: "Space Grotesk", system-ui, sans-serif;
    --font-body: "Inter", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: var(--font-body);
    font-size: clamp(14px, 1.05vw, 20px);
    display: flex; flex-direction: column;
    overflow: hidden;
    padding: 30px;  /* luft mot skjermkantene */
  }
  button { font: inherit; color: inherit; }

  /* ---------- header ---------- */
  header {
    display: flex; align-items: center; gap: 2em;
    padding: 1.2em 2.2em 1em;
    border-bottom: 1px solid var(--border);
  }
  .logo { height: 3.4em; width: auto; flex: none; color: var(--text-primary); }
  .brand { flex: 1; min-width: 0; padding-left: 1.6em; border-left: 1px solid var(--border); }
  .brand .kicker { color: var(--text-muted); font-size: .8em; letter-spacing: .08em; text-transform: uppercase; }
  .brand h1 { font-family: var(--font-display); font-weight: 700; font-size: 1.6em; margin: 0; line-height: 1.1; }
  .legend { display: flex; gap: 1.6em; align-items: center; }
  .legend-item { display: flex; align-items: center; gap: .55em; color: var(--text-secondary); white-space: nowrap; }
  .legend-item b { color: var(--text-primary); font-weight: 600; }
  .swatch { width: 1em; height: 1em; flex: none; overflow: visible; }
  .mini-qr { display: flex; align-items: center; gap: .8em; color: var(--text-muted); font-size: .8em; cursor: pointer; background: none; border: 0; padding: 0; }
  .mini-qr .qr { width: 4.2em; height: 4.2em; background: #fff; border-radius: 6px; padding: 3px; }
  .mini-qr .qr svg { width: 100%; height: 100%; display: block; }

  main { flex: 1; min-height: 0; position: relative; }
  .view { position: absolute; inset: 0; padding: 1.6em 2.2em; overflow: auto; display: none; }
  .view.active { display: block; }

  /* ---------- QR view ---------- */
  #view-qr.active { display: flex; align-items: center; justify-content: center; gap: 5em; }
  .qr-big { width: min(52vh, 36vw); aspect-ratio: 1; background: #fff; border-radius: 18px; padding: 18px; }
  .qr-big svg { width: 100%; height: 100%; display: block; }
  .qr-missing { color: #333; display: flex; align-items: center; justify-content: center; height: 100%; text-align: center; font-size: .9em; padding: 1em; }
  .qr-text h2 { font-family: var(--font-display); font-size: 3em; line-height: 1.05; margin: 0 0 .4em; max-width: 12em; }
  .qr-text p { color: var(--text-secondary); font-size: 1.25em; max-width: 26em; line-height: 1.45; margin: 0 0 1.2em; }
  .qr-url { display: inline-block; font-family: var(--font-display); font-size: 1.6em; color: var(--text-primary); margin-bottom: 1.2em; word-break: break-all; text-decoration: underline; text-decoration-color: var(--text-muted); text-underline-offset: .2em; }
  .qr-url:hover { text-decoration-color: var(--text-primary); }
  a.qr-big { display: block; }
  .big-count { display: flex; gap: 2.2em; margin-top: 1.4em; }
  .big-count .n { font-family: var(--font-display); font-size: 3.2em; font-weight: 700; line-height: 1; }
  .big-count .l { color: var(--text-muted); display: flex; align-items: center; gap: .45em; margin-top: .3em; }

  /* ---------- overview ---------- */
  .ov-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 1em; }
  .ov-head h2 { font-family: var(--font-display); font-size: 1.35em; margin: 0; }
  .ov-head .hint { color: var(--text-muted); font-size: .85em; }
  .grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1em 1.4em; }
  .card {
    background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px;
    padding: 1em 1.2em .8em; cursor: pointer; text-align: left; width: 100%;
    display: flex; flex-direction: column; gap: .5em; transition: border-color .15s;
  }
  .card:hover, .card:focus-visible { border-color: var(--text-muted); outline: none; }
  .card .top { display: flex; gap: .8em; align-items: flex-start; }
  .card .num { font-family: var(--font-display); color: var(--text-muted); font-size: .9em; padding-top: .1em; }
  .card .stmt { flex: 1; font-weight: 500; line-height: 1.35; }
  .badge { font-size: .72em; padding: .25em .6em; border-radius: 99px; border: 1px solid var(--border); color: var(--text-secondary); white-space: nowrap; }
  .badge.hot { border-color: #e66767; color: #f3b0b0; }
  .badge.hot::before { content: "▲ "; font-size: .8em; }
  .strip { width: 100%; height: auto; display: block; }
  .d-dots { width: 100%; height: auto; display: block; overflow: visible; }
  .d-dots text { font-family: var(--font-body); }
  .d-row.dots { align-items: center; }
  .strip text { font-family: var(--font-body); }

  /* ---------- detail ---------- */
  #view-detail .wrap { max-width: 1500px; margin: 0 auto; }
  .d-meta { display: flex; justify-content: space-between; color: var(--text-muted); font-size: .9em; margin-bottom: .6em; }
  .d-stmt { font-family: var(--font-display); font-size: 2.3em; font-weight: 500; line-height: 1.18; margin: 0 0 1.1em; max-width: 30em; }
  .d-rows { display: flex; flex-direction: column; gap: 1.4em; }
  .d-row { display: grid; grid-template-columns: 11em 1fr 7em; align-items: center; gap: 1.2em; }
  .d-label { display: flex; align-items: center; gap: .6em; font-weight: 600; font-size: 1.15em; }
  .d-label small { display: block; color: var(--text-muted); font-weight: 400; font-size: .75em; }
  .d-bar { position: relative; height: 3.2em; }
  .d-bar .center { position: absolute; left: 50%; top: -.5em; bottom: -.5em; width: 1px; background: var(--text-muted); opacity: .6; }
  .d-seg { position: absolute; top: 0; bottom: 0; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: .95em; color: #fff; overflow: hidden; }
  .d-seg + .d-seg { box-shadow: inset 2px 0 0 var(--surface-0); }
  .d-seg:first-child { border-radius: 4px 0 0 4px; }
  .d-seg.last { border-radius: 0 4px 4px 0; }
  .d-mean { font-family: var(--font-display); font-size: 1.7em; font-weight: 700; text-align: right; }
  .d-mean small { display: block; font-family: var(--font-body); font-size: .45em; color: var(--text-muted); font-weight: 400; }
  .d-empty { color: var(--text-muted); font-style: italic; }
  .scale-legend { display: flex; justify-content: center; gap: 1.4em; margin-top: 2.2em; color: var(--text-secondary); font-size: .9em; flex-wrap: wrap; }
  .scale-legend span { display: flex; align-items: center; gap: .45em; }
  .scale-legend i { width: 1em; height: .8em; border-radius: 2px; display: inline-block; }
  .ends { display: grid; grid-template-columns: 11em 1fr 7em; gap: 1.2em; color: var(--text-muted); margin-bottom: .5em; }
  .ends > div { font-size: .85em; }
  .ends div { display: flex; justify-content: space-between; }
  .ends .ticks { position: relative; height: 1.3em; display: block; }
  .ends .ticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .callout { margin-top: 2em; padding: 1em 1.3em; border-left: 3px solid #e66767; background: var(--surface-1); border-radius: 0 8px 8px 0; color: var(--text-secondary); font-size: 1.05em; max-width: 60em; }
  .callout b { color: var(--text-primary); }
  table.data { border-collapse: collapse; margin-top: 2em; font-size: .9em; }
  table.data th, table.data td { padding: .4em .9em; border-bottom: 1px solid var(--border); text-align: right; }
  table.data th:first-child, table.data td:first-child { text-align: left; }
  table.data th { color: var(--text-muted); font-weight: 500; }

  /* ---------- questions ---------- */
  .q-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1em 1.4em; }
  .q-card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 1.1em 1.3em; display: flex; flex-direction: column; gap: .8em; }
  .q-card .q-text { font-family: var(--font-display); font-size: 1.45em; font-weight: 500; line-height: 1.25; overflow-wrap: anywhere; }
  .q-card .q-foot { display: flex; align-items: center; gap: .6em; color: var(--text-muted); font-size: .85em; }
  .q-card .q-foot .who { display: flex; align-items: center; gap: .45em; margin-right: auto; }
  .q-card button { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: .3em .8em; cursor: pointer; font-size: .95em; }
  .q-card button:hover { border-color: var(--text-muted); }
  .q-card.done { opacity: .45; }
  .q-card.done .q-text { text-decoration: line-through; text-decoration-thickness: 1px; }
  .q-card.hidden-q { opacity: .35; border-style: dashed; }
  .q-empty { color: var(--text-muted); font-size: 1.2em; padding: 2em 0; }
  .linkbtn { background: none; border: 0; color: var(--text-muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 1em; }

  /* ---------- hidden overlay ---------- */
  .veil { position: absolute; inset: 0; background: var(--surface-0); display: none; align-items: center; justify-content: center; flex-direction: column; gap: .6em; z-index: 5; }
  body.hidden-results .veil.on-results { display: flex; }
  .veil h2 { font-family: var(--font-display); font-size: 2.4em; margin: 0; }
  .veil p { color: var(--text-muted); margin: 0; font-size: 1.2em; }

  /* ---------- footer ---------- */
  footer {
    display: flex; align-items: center; gap: .5em; padding: .6em 2.2em;
    border: 1px solid var(--border); border-radius: 12px; background: var(--surface-1); font-size: .85em; margin-top: 16px;
  }
  footer button {
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px;
    padding: .45em .9em; cursor: pointer;
  }
  footer button:hover { border-color: var(--text-muted); }
  footer button.on { background: var(--text-primary); color: var(--surface-0); }
  footer .sep { width: 1px; height: 1.6em; background: var(--border); margin: 0 .4em; }
  footer .status { margin-left: auto; color: var(--text-muted); display: flex; align-items: center; gap: .6em; }
  .dot-live { width: .55em; height: .55em; border-radius: 50%; background: #0ca30c; }
  .dot-live.err { background: #d03b3b; }
  .dot-live.paused { background: #fab219; }
  .demo-tag { color: #fab219; border: 1px solid #fab219; border-radius: 99px; padding: .1em .6em; font-size: .85em; }
  kbd { font-family: inherit; font-size: .8em; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 .3em; margin-left: .3em; }

  /* ---------- fit many buttons and four groups on one line ---------- */
  footer button { white-space: nowrap; padding: .45em .75em; }
  footer .status { white-space: nowrap; min-width: 0; overflow: hidden; }
  footer .status #statusText { overflow: hidden; text-overflow: ellipsis; }
  .brand h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .legend { gap: 1.2em; }
  @media (max-width: 1800px) { footer kbd { display: none; } }

  /* ---------- smaller screens ---------- */
  @media (max-width: 1300px) {
    footer { flex-wrap: wrap; row-gap: .5em; }
    footer .status { margin-left: auto; }
    header { flex-wrap: wrap; row-gap: .8em; }
    .brand h1 { white-space: normal; }
    .legend { order: 3; flex-basis: 100%; flex-wrap: wrap; }
  }
  @media (max-width: 900px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow: auto; padding: 14px; font-size: 15px; }
    header { gap: .8em 1.2em; padding: .4em 0 1em; }
    .logo { height: 2.4em; }
    .brand { flex-basis: 100%; order: 2; padding-left: 0; border-left: 0; }
    .brand h1 { font-size: 1.35em; }
    .legend { order: 3; flex-wrap: wrap; gap: .5em 1em; font-size: .9em; }
    .mini-qr { margin-left: auto; }
    main { flex: none; }
    .view { position: static; padding: 1.2em 0; overflow: visible; }
    #view-qr.active { flex-direction: column; gap: 1.6em; text-align: center; }
    .qr-big { width: min(72vw, 340px); padding: 12px; }
    .qr-text h2 { font-size: 2em; max-width: none; }
    .qr-text p { font-size: 1.05em; margin-left: auto; margin-right: auto; }
    .qr-url { font-size: 1.2em; }
    .big-count { justify-content: center; flex-wrap: wrap; gap: 1em 1.6em; }
    .big-count .n { font-size: 2.2em; }
    .ov-head { flex-direction: column; gap: .3em; }
    .grid, .q-list { grid-template-columns: 1fr; }
    .d-meta { flex-direction: column; gap: .2em; }
    .d-stmt { font-size: 1.5em; margin-bottom: .8em; }
    .ends { grid-template-columns: 1fr; }
    .ends > span { display: none; }
    .d-row { grid-template-columns: 1fr auto; gap: .4em 1em; }
    .d-row .d-label { grid-column: 1; grid-row: 1; }
    .d-row .d-mean { grid-column: 2; grid-row: 1; font-size: 1.3em; }
    .d-row .d-bar, .d-row .d-dots, .d-row .d-empty { grid-column: 1 / -1; grid-row: 2; }
    .d-bar { height: 2.4em; }
    .scale-legend { gap: .6em 1em; }
    .callout { font-size: 1em; }
    table.data { font-size: .8em; display: block; overflow-x: auto; }
    .veil { position: fixed; }
    footer { position: sticky; bottom: 0; flex-wrap: nowrap; overflow-x: auto; margin-top: .6em; padding: .5em .6em; }
    footer .sep { display: none; }
    footer .status { display: none; }
  }

  /* ---------- tooltip ---------- */
  #tip { position: fixed; pointer-events: none; background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: .5em .7em; font-size: .85em; z-index: 10; display: none; box-shadow: 0 6px 20px rgba(0,8,20,.5); }
  #tip b { display: block; margin-bottom: .15em; }
  #tip span { color: var(--text-secondary); }
</style>

(() => {
  "use strict";
  const C = CONFIG;
  const GROUP_COLORS = ["var(--g1)", "var(--g2)", "var(--g3)", "var(--g4)", "#d55181"];
  const DEFAULT_SHAPES = ["circle", "square", "triangle", "diamond", "circle"];
  const shapeOf = (gi) => (C.groups[gi] && C.groups[gi].shape) || DEFAULT_SHAPES[gi % DEFAULT_SHAPES.length];

  // Draws a group's mark (colour + shape) centred on (cx, cy), roughly equal visual weight to a circle of radius r.
  function mark(gi, cx, cy, r, extra = "") {
    const fill = `fill="${GROUP_COLORS[gi]}"`;
    const f = (n) => n.toFixed(2);
    switch (shapeOf(gi)) {
      case "square": {
        const a = r * 1.75;
        return `<rect x="${f(cx - a / 2)}" y="${f(cy - a / 2)}" width="${f(a)}" height="${f(a)}" rx="${f(r * 0.18)}" ${fill} ${extra}/>`;
      }
      case "triangle": {
        const side = r * 2.35, h = side * 0.866;
        const pts = [[cx, cy - h * 2 / 3], [cx + side / 2, cy + h / 3], [cx - side / 2, cy + h / 3]];
        return `<polygon points="${pts.map(q => q.map(f).join(",")).join(" ")}" stroke-linejoin="round" ${fill} ${extra}/>`;
      }
      case "diamond": {
        const d = r * 1.3;
        return `<polygon points="${f(cx)},${f(cy - d)} ${f(cx + d)},${f(cy)} ${f(cx)},${f(cy + d)} ${f(cx - d)},${f(cy)}" ${fill} ${extra}/>`;
      }
      default:
        return `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" ${fill} ${extra}/>`;
    }
  }
  const swatch = (gi) => `<svg class="swatch" viewBox="-10 -10 20 20" aria-hidden="true">${mark(gi, 0, 0.6, 8)}</svg>`;
  const LEVELS = C.scale.max - C.scale.min + 1;
  const $ = (s) => document.querySelector(s);
  const fmt = (x, d = 1) => x == null || isNaN(x) ? "–" : x.toFixed(d).replace(".", ",");

  const params = new URLSearchParams(location.search);
  const DEMO = params.has("demo") || (!C.sheetId && !C.scriptUrl);

  const state = {
    rows: [],            // [{group: idx, answers: [value|null,...]}]
    stats: [],           // per statement
    view: "qr",
    current: 0,
    sortByGap: true,
    hidden: false,
    showTable: false,
    showAll: false,
    lastOk: null,
    paused: false,
    questions: [],
    showHiddenQ: false,
    error: null
  };

  /* ---------- colours for the scale (diverging red ↔ grey ↔ blue) ---------- */
  function mix(a, b, t) {
    const pa = a.match(/\w\w/g).map(h => parseInt(h, 16));
    const pb = b.match(/\w\w/g).map(h => parseInt(h, 16));
    return "#" + pa.map((v, i) => Math.round(v + (pb[i] - v) * t).toString(16).padStart(2, "0")).join("");
  }
  const NEG = "#d94f4f", MID = "#56606f", POS = "#2f7fdc";
  const SCALE_COLORS = Array.from({ length: LEVELS }, (_, i) => {
    const t = LEVELS === 1 ? 0.5 : i / (LEVELS - 1);
    return t < 0.5 ? mix(NEG, MID, t / 0.5) : mix(MID, POS, (t - 0.5) / 0.5);
  });

  /* ---------- static header ---------- */
  $("#title").textContent = C.title;
  $("#stmtCount").textContent = C.statements.length;
  const shownUrl = C.shortUrl || C.formUrl.replace(/^https?:\/\//, "");
  $("#qrUrl").textContent = shownUrl || "";
  if (C.formUrl) { $("#qrUrl").href = C.formUrl; $("#qrBig").href = C.formUrl; }

  function renderQR() {
    // Prefer the short link: a shorter address gives a simpler QR code that scans more easily from far away.
    const short = C.shortUrl ? (/^https?:\/\//.test(C.shortUrl) ? C.shortUrl : "https://" + C.shortUrl) : "";
    const url = short || C.formUrl || (DEMO ? "https://ixda.org/bergen" : "");
    const targets = [$("#qrBig"), $("#qrSmall")];
    if (!url || typeof qrcode === "undefined") {
      targets[0].innerHTML = `<div class="qr-missing">${url ? "Kunne ikke laste QR-biblioteket" : "Legg inn <code>formUrl</code> i konfigurasjonen"}</div>`;
      targets[1].parentElement.hidden = true;
      return;
    }
    const qr = qrcode(0, "M");
    qr.addData(url);
    qr.make();
    const svg = qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true });
    targets.forEach(t => t.innerHTML = svg);
  }

  /* ---------- CSV ---------- */
  function parseCSV(text) {
    const rows = []; let row = []; let field = ""; let q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) {
        if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
        else field += c;
      } else if (c === '"') q = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n" || c === "\r") {
        if (c === "\r" && text[i + 1] === "\n") i++;
        row.push(field); rows.push(row); row = []; field = "";
      } else field += c;
    }
    if (field !== "" || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(v => v.trim() !== ""));
  }

  const compact = (s) => norm(s).replace(/\s+/g, "");
  const norm = (s) => String(s).toLowerCase().normalize("NFKC").replace(/[^\p{L}\p{N}]+/gu, " ").trim();

  function valueOf(raw) {
    const s = String(raw).trim();
    if (!s) return null;
    const n = parseFloat(s.replace(",", "."));
    if (!isNaN(n) && n >= C.scale.min && n <= C.scale.max) return Math.round(n);
    const idx = C.scale.labels.findIndex(l => norm(l) === norm(s));
    return idx >= 0 ? C.scale.min + idx : null;
  }

  function rowsFromCSV(text) { return rowsFromTable(parseCSV(text)); }

  const lastIndex = (arr, fn) => { for (let i = arr.length - 1; i >= 0; i--) if (fn(arr[i])) return i; return -1; };

  function rowsFromTable(table) {
    if (table.length === 0) return [];
    const header = table[0].map(norm);
    const roleCol = header.findIndex(h => h.includes(norm(C.roleQuestion)));
    if (roleCol < 0) throw new Error(`Fant ikke spørsmålet «${C.roleQuestion}» i regnearket`);
    const stmtCols = C.statements.map(s => {
      const ns = norm(s);
      // Use the LAST matching column: if a question is deleted and added again, Google keeps the old column first.
      return lastIndex(header, h => h && (h.includes(ns) || ns.includes(h)));
    });
    const missing = stmtCols.filter(c => c < 0).length;
    state.missingCols = missing;
    const qKey = norm(C.questionColumn || "");
    const qCol = qKey ? lastIndex(header, h => h.includes(qKey)) : -1;
    const all = table.slice(1).map(r => {
      // Compare without spaces/punctuation, so "in-house", "in house" and "inhouse" all match.
      const role = compact(r[roleCol] || "");
      const group = C.groups.findIndex(g => role.includes(compact(g.match)));
      return {
        group, time: String(r[0] || ""),
        question: qCol >= 0 ? String(r[qCol] || "").trim() : "",
        answers: stmtCols.map(c => c < 0 ? null : valueOf(r[c] || ""))
      };
    });
    setQuestions(all);
    return all.filter(r => r.group >= 0);
  }

  // Loads a JSONP script; `makeUrl(cb)` builds the URL for the callback name.
  let jsonpSeq = 0;
  function jsonp(makeUrl, onData) {
    return new Promise((resolve, reject) => {
      const cb = "__ixdaSheet" + (++jsonpSeq);
      const s = document.createElement("script");
      const timer = setTimeout(() => { done(); reject(new Error("Fikk ikke svar fra regnearket")); }, 10000);
      function done() { clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = (resp) => { done(); try { resolve(onData(resp)); } catch (e) { reject(e); } };
      s.onerror = () => { done(); reject(new Error("Kunne ikke nå regnearket – sjekk delingen")); };
      s.src = makeUrl(cb);
      document.head.appendChild(s);
    });
  }

  // Fastest: a small Apps Script web app that reads the sheet directly (no Google cache).
  function fetchFromScript() {
    return jsonp(
      (cb) => `${C.scriptUrl}${C.scriptUrl.includes("?") ? "&" : "?"}callback=${cb}&_=${Date.now()}`,
      (resp) => {
        if (!Array.isArray(resp)) throw new Error("Apps Script svarte ikke med en tabell");
        return resp.map(r => r.map(v => v == null ? "" : String(v)));
      });
  }

  // Default: Google Visualization JSONP (works from any site without CORS setup).
  // Google caches identical queries, so each request asks a slightly different (but equivalent) query.
  const cacheBust = () => `&tq=${encodeURIComponent("select * limit " + (1000000 + (Date.now() % 1000000)))}`;
  function fetchSheetJsonp() {
    return jsonp(
      (cb) => `https://docs.google.com/spreadsheets/d/${encodeURIComponent(C.sheetId)}/gviz/tq?tqx=out:json;responseHandler:${cb}&headers=1&sheet=${encodeURIComponent(C.sheetName)}${cacheBust()}`,
      (resp) => {
        if (!resp || resp.status === "error") {
          const msg = resp && resp.errors && resp.errors[0] ? (resp.errors[0].detailed_message || resp.errors[0].message) : "ukjent feil";
          throw new Error("Regnearket: " + msg);
        }
        const cols = resp.table.cols.map(c => c.label || "");
        const rows = resp.table.rows.map(r => (r.c || []).map(c => c == null || c.v == null ? "" : String(c.v)));
        return [cols, ...rows];
      });
  }

  async function fetchSheet() {
    if (C.scriptUrl) return rowsFromTable(await fetchFromScript());
    try { return rowsFromTable(await fetchSheetJsonp()); }
    catch (e) {
      if (/Fant ikke spørsmålet/.test(e.message)) throw e;
      try { return await fetchSheetCsv(); } catch (_) { throw e; }
    }
  }

  async function fetchSheetCsv() {
    const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(C.sheetId)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(C.sheetName)}${cacheBust()}`;
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error(`Regnearket svarte ${res.status}`);
    const text = await res.text();
    if (/^\s*</.test(text)) throw new Error("Regnearket er ikke delt som «Alle som har linken kan se»");
    return rowsFromCSV(text);
  }

  /* ---------- demo data ---------- */
  // Each statement: per-group lean (−2..+2). Purely invented for the preview.
  const DEMO_LEAN = [
    [1.6, 0.6, 0.9], [0.5, 1.4, 0.4], [-0.1, 1.3, -1.1], [0.9, -0.6, 0.3],
    [-0.4, -0.9, -0.2], [-0.2, 0.8, -0.7], [0.9, 0.2, 0.4], [0.7, 0.3, 1.2]
  ];
  const demoRows = [];
  function demoAdd(n) {
    for (let k = 0; k < n; k++) {
      const r = Math.random();
      const group = r < 0.55 ? 0 : r < 0.75 ? 1 : r < 0.9 ? 2 : 3;
      const answers = C.statements.map((_, i) => {
        const lean = (DEMO_LEAN[i % DEMO_LEAN.length] || [0, 0, 0])[group] || 0;
        const mid = (C.scale.min + C.scale.max) / 2;
        const half = (C.scale.max - C.scale.min) / 2;
        const v = mid + lean * half / 2 + (Math.random() + Math.random() + Math.random() - 1.5) * half * 0.8;
        return Math.max(C.scale.min, Math.min(C.scale.max, Math.round(v)));
      });
      const question = Math.random() < 0.18 ? DEMO_Q[demoRows.length % DEMO_Q.length] : "";
      demoRows.push({ group, answers, question, time: "demo-" + demoRows.length });
    }
  }
  const DEMO_Q = [
    "Hva ser dere etter i en portefølje fra en nyutdannet?",
    "Hvor viktig er det å kunne kode som designer i dag?",
    "Tar dere inn sommerstudenter, og når bør man søke?",
    "Hvordan bruker dere AI i designprosessen allerede nå?",
    "Er det lettere å få jobb i offentlig sektor enn i privat?",
    "Hva er den største forskjellen på å jobbe i konsulenthus og inhouse?"
  ];

  /* ---------- questions from the audience ---------- */
  // Status per question (done / hidden) is kept in this browser so a reload doesn't lose it.
  const Q_KEY = "ixda-q-status-" + (C.sheetId || C.scriptUrl || "demo");
  let qStatus = {};
  try { qStatus = JSON.parse(localStorage.getItem(Q_KEY) || "{}"); } catch (_) {}
  const saveQ = () => { try { localStorage.setItem(Q_KEY, JSON.stringify(qStatus)); } catch (_) {} };
  const qId = (q) => q.time + "|" + q.text;
  function setQuestions(rows) {
    state.questions = rows.filter(r => r.question).map(r => ({ text: r.question, group: r.group, time: r.time }));
  }

  /* ---------- statistics ---------- */
  function computeStats() {
    state.stats = C.statements.map((text, i) => {
      const groups = C.groups.map((g, gi) => {
        const vals = state.rows.filter(r => r.group === gi).map(r => r.answers[i]).filter(v => v != null);
        const counts = Array(LEVELS).fill(0);
        vals.forEach(v => counts[v - C.scale.min]++);
        const n = vals.length;
        const mean = n ? vals.reduce((a, b) => a + b, 0) / n : null;
        return { n, mean, counts };
      });
      const means = groups.filter(g => g.n > 0).map(g => g.mean);
      const gap = means.length >= 2 ? Math.max(...means) - Math.min(...means) : 0;
      let hi = -1, lo = -1;
      groups.forEach((g, gi) => {
        if (!g.n) return;
        if (hi < 0 || g.mean > groups[hi].mean) hi = gi;
        if (lo < 0 || g.mean < groups[lo].mean) lo = gi;
      });
      return { i, text, groups, gap, hi, lo };
    });
  }
  const order = () => state.sortByGap ? [...state.stats].sort((a, b) => b.gap - a.gap) : state.stats;
  const groupCount = (gi) => state.rows.filter(r => r.group === gi).length;

  /* ---------- rendering ---------- */
  function renderLegend() {
    $("#legend").innerHTML = C.groups.map((g, gi) =>
      `<div class="legend-item">${swatch(gi)}${g.label} <b>${groupCount(gi)}</b></div>`).join("");
    $("#bigCount").innerHTML = `<div><div class="n">${state.rows.length}</div><div class="l">svar totalt</div></div>` +
      C.groups.map((g, gi) => `<div><div class="n">${groupCount(gi)}</div><div class="l">${swatch(gi)}${g.label}</div></div>`).join("");
    $("#veilCount").textContent = `${state.rows.length} har svart så langt`;
  }

  // Packs `count` dots around (cx, cy) in rows of at most `perRow`, centred on the value.
  const narrow = () => window.innerWidth < 900;
  let resizeTimer = null, wasNarrow = narrow();
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { if (narrow() !== wasNarrow) { wasNarrow = narrow(); render(); } }, 150);
  });

  function packDots(count, cx, cy, perRow, step) {
    const out = [], rows = Math.ceil(count / perRow);
    for (let j = 0; j < count; j++) {
      const row = Math.floor(j / perRow), col = j % perRow;
      const inRow = row < rows - 1 ? perRow : count - row * perRow;
      out.push([cx + (col - (inRow - 1) / 2) * step, cy + (row - (rows - 1) / 2) * step]);
    }
    return out;
  }
  const levelLabel = (k) => `${C.scale.labels[k] || ""} (${C.scale.min + k})`.trim();

  function strip(st) {
    // Dot strip: one lane per group on a shared scale axis.
    // Mean mode: one dot per group. «Alle svar» mode: one dot per answer + a tick for the mean.
    // Narrower drawing on phones, so marks and labels keep a readable size when scaled down.
    const W = narrow() ? 360 : 600, padL = narrow() ? 30 : 40, padR = padL, top = 10, all = state.showAll;
    const x = (v) => padL + (v - C.scale.min) / (C.scale.max - C.scale.min) * (W - padL - padR);
    const r = 4.2, step = 2 * r + 2;
    const perRow = Math.max(1, Math.floor((W - padL - padR) / (C.scale.max - C.scale.min) * 0.84 / step));
    const laneHs = st.groups.map(g => all ? Math.max(20, Math.max(1, ...g.counts.map(c => Math.ceil(c / perRow))) * step + 8) : 18);
    const laneTop = []; let acc = top;
    laneHs.forEach(h => { laneTop.push(acc); acc += h; });
    const bottom = acc, H = bottom + 22;
    const cy = (gi) => laneTop[gi] + laneHs[gi] / 2;
    let s = `<svg class="strip" viewBox="0 0 ${W} ${H}" role="img" aria-label="${all ? "Alle svar per gruppe" : "Gjennomsnitt per gruppe"}">`;
    for (let v = C.scale.min; v <= C.scale.max; v++) {
      s += `<line x1="${x(v)}" x2="${x(v)}" y1="${top - 4}" y2="${bottom}" stroke="var(--grid)" stroke-width="1"/>`;
    }
    const midV = (C.scale.min + C.scale.max) / 2;
    s += `<line x1="${x(midV)}" x2="${x(midV)}" y1="${top - 6}" y2="${bottom + 2}" stroke="var(--text-muted)" stroke-width="1" opacity=".7"/>`;
    st.groups.forEach((g, gi) => {
      if (all && gi > 0) s += `<line x1="${x(C.scale.min)}" x2="${x(C.scale.max)}" y1="${laneTop[gi]}" y2="${laneTop[gi]}" stroke="var(--grid)" stroke-width="1"/>`;
      if (!all) s += `<line x1="${x(C.scale.min)}" x2="${x(C.scale.max)}" y1="${cy(gi)}" y2="${cy(gi)}" stroke="var(--grid)" stroke-width="1"/>`;
    });
    st.groups.forEach((g, gi) => {
      if (!g.n) return;
      if (all) {
        g.counts.forEach((c, k) => {
          packDots(c, x(C.scale.min + k), cy(gi), perRow, step).forEach(([dx, dy]) => {
            s += mark(gi, dx, dy, r, `data-tip="${C.groups[gi].label}|${levelLabel(k)} · ${c} av ${g.n}"`);
          });
        });
        const h = laneHs[gi] - 4;
        s += `<rect x="${x(g.mean) - 2}" y="${cy(gi) - h / 2}" width="4" height="${h}" rx="2" fill="var(--text-primary)" stroke="var(--surface-1)" stroke-width="1.5"
               data-tip="${C.groups[gi].label}|Snitt ${fmt(g.mean)} · ${g.n} svar"/>`;
      } else {
        s += mark(gi, x(g.mean), cy(gi), 7.5, `stroke="var(--surface-1)" stroke-width="2" data-tip="${C.groups[gi].label}|Snitt ${fmt(g.mean)} · ${g.n} svar"`);
      }
    });
    const yb = bottom + 16;
    s += `<text x="${padL}" y="${yb}" fill="var(--text-muted)" font-size="11">${C.scale.labels[0]}</text>`;
    s += `<text x="${W - padR}" y="${yb}" fill="var(--text-muted)" font-size="11" text-anchor="end">${C.scale.labels[C.scale.labels.length - 1]}</text>`;
    return s + "</svg>";
  }

  function renderOverview() {
    const list = order();
    const maxGap = Math.max(0, ...state.stats.map(s => s.gap));
    $("#ovHint").textContent = (state.showAll ? "Hvert merke er ett svar, hvit strek er snittet · " : "") +
      (state.sortByGap ? "Sortert etter størst avstand mellom gruppene · klikk et utsagn for detaljer" : "I opprinnelig rekkefølge · klikk et utsagn for detaljer");
    $("#grid").innerHTML = list.map(st => {
      const hot = st.gap > 0 && st.gap === maxGap && st.gap >= 0.5;
      return `<button class="card" data-i="${st.i}">
        <div class="top"><span class="num">${st.i + 1}</span><span class="stmt">${esc(st.text)}</span>
        <span class="badge ${hot ? "hot" : ""}">avstand ${fmt(st.gap)}</span></div>
        ${strip(st)}
      </button>`;
    }).join("");
  }

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

  // Detail view, «Alle svar»: every answer as a dot in its group colour, stacked per scale step.
  function dotRow(g, gi) {
    const W = narrow() ? 420 : 1000, pad = W * 0.09, r = 7, step = 2 * r + 3;
    const x = (v) => pad + (v - C.scale.min) / (C.scale.max - C.scale.min) * (W - 2 * pad);
    const perRow = Math.max(1, Math.floor((W - 2 * pad) / (C.scale.max - C.scale.min) * 0.8 / step));
    const rows = Math.max(1, ...g.counts.map(c => Math.ceil(c / perRow)));
    const plotH = Math.max(2 * r + 10, rows * step + 8), H = plotH + 22, cy = plotH / 2;
    let s = `<svg class="d-dots" viewBox="0 0 ${W} ${H}" role="img" aria-label="Alle svar fra ${esc(C.groups[gi].label)}">`;
    for (let v = C.scale.min; v <= C.scale.max; v++) {
      s += `<line x1="${x(v)}" x2="${x(v)}" y1="0" y2="${plotH}" stroke="var(--grid)" stroke-width="1"/>`;
    }
    g.counts.forEach((c, k) => {
      packDots(c, x(C.scale.min + k), cy, perRow, step).forEach(([dx, dy]) => {
        s += mark(gi, dx, dy, r, `data-tip="${C.groups[gi].label}|${levelLabel(k)} · ${c} av ${g.n}"`);
      });
      s += `<text x="${x(C.scale.min + k)}" y="${H - 4}" text-anchor="middle" font-size="15" fill="var(--text-muted)">${c}</text>`;
    });
    s += `<rect x="${x(g.mean) - 2.5}" y="0" width="5" height="${plotH}" rx="2.5" fill="var(--text-primary)" stroke="var(--surface-0)" stroke-width="2"
           data-tip="${C.groups[gi].label}|Snitt ${fmt(g.mean)}"/>`;
    return s + "</svg>";
  }

  function renderDetail() {
    const st = state.stats[state.current];
    if (!st) return;
    // Diverging layout: neutral split around the centre line.
    const hasMid = LEVELS % 2 === 1, midIdx = Math.floor(LEVELS / 2);
    const sides = st.groups.map(g => {
      if (!g.n) return [0, 0];
      const p = g.counts.map(c => c / g.n * 100);
      let neg = 0, pos = 0;
      p.forEach((v, k) => { if (hasMid && k === midIdx) { neg += v / 2; pos += v / 2; } else if (k < LEVELS / 2) neg += v; else pos += v; });
      return [neg, pos];
    });
    const maxSide = Math.max(50, ...sides.flat());
    const unit = 48 / maxSide; // % of bar width per percentage point

    const rows = st.groups.map((g, gi) => {
      const label = `<div class="d-label">${swatch(gi)}<div>${C.groups[gi].label}<small>${g.n} svar</small></div></div>`;
      if (!g.n) return `<div class="d-row">${label}<div class="d-empty">Ingen svar ennå</div><div></div></div>`;
      const meanCell = `<div class="d-mean">${fmt(g.mean)}<small>snitt (${C.scale.min}–${C.scale.max})</small></div>`;
      if (state.showAll) return `<div class="d-row">${label}${dotRow(g, gi)}${meanCell}</div>`;
      let left = 50 - sides[gi][0] * unit;
      const segs = g.counts.map((c, k) => {
        const pct = c / g.n * 100, w = pct * unit;
        const html = w > 0 ? `<div class="d-seg" style="left:${left}%;width:${w}%;background:${SCALE_COLORS[k]}" data-tip="${C.groups[gi].label}|${C.scale.labels[k] || (C.scale.min + k)}: ${c} (${Math.round(pct)} %)">${pct >= 9 ? Math.round(pct) + "%" : ""}</div>` : "";
        left += w; return html;
      }).filter(Boolean);
      if (segs.length) segs[segs.length - 1] = segs[segs.length - 1].replace('class="d-seg"', 'class="d-seg last"');
      return `<div class="d-row">${label}<div class="d-bar"><div class="center"></div>${segs.join("")}</div>
        <div class="d-mean">${fmt(g.mean)}<small>snitt (${C.scale.min}–${C.scale.max})</small></div></div>`;
    }).join("");

    let callout = "";
    if (st.hi >= 0 && st.lo >= 0 && st.hi !== st.lo && st.gap >= 0.5) {
      callout = `<div class="callout"><b>${C.groups[st.hi].label}</b> er mest enige (${fmt(st.groups[st.hi].mean)}), <b>${C.groups[st.lo].label}</b> minst (${fmt(st.groups[st.lo].mean)}). Hvorfor ser dere det så ulikt?</div>`;
    } else if (state.rows.length) {
      callout = `<div class="callout">Gruppene er ganske samstemte her. Er det noen i panelet som ser det annerledes?</div>`;
    }

    const table = state.showTable ? `<table class="data"><thead><tr><th>Gruppe</th>${C.scale.labels.map(l => `<th>${l}</th>`).join("")}<th>Snitt</th><th>n</th></tr></thead><tbody>
      ${st.groups.map((g, gi) => `<tr><td>${C.groups[gi].label}</td>${g.counts.map(c => `<td>${c}</td>`).join("")}<td>${fmt(g.mean)}</td><td>${g.n}</td></tr>`).join("")}</tbody></table>` : "";

    $("#detail").innerHTML = `
      <div class="d-meta"><span>Utsagn ${st.i + 1} av ${C.statements.length}</span><span>Avstand mellom gruppene: ${fmt(st.gap)}</span></div>
      <h2 class="d-stmt">${esc(st.text)}</h2>
      ${state.showAll
        ? `<div class="ends"><span></span><div class="ticks">${C.scale.labels.map((l, k) => `<span style="left:${9 + 82 * k / Math.max(1, LEVELS - 1)}%">${l}</span>`).join("")}</div><span></span></div>`
        : `<div class="ends"><span></span><div><span>← ${C.scale.labels[0]}</span><span>${C.scale.labels[C.scale.labels.length - 1]} →</span></div><span></span></div>`}
      <div class="d-rows">${rows}</div>
      <div class="scale-legend">${state.showAll
        ? `<span>${C.groups.map((_, gi) => swatch(gi)).join("")}Hvert merke = ett svar</span><span><i style="background:var(--text-primary);width:.3em;height:1.1em"></i>Snitt</span><span>Tallet under er antall svar på hvert trinn</span>`
        : C.scale.labels.map((l, k) => `<span><i style="background:${SCALE_COLORS[k]}"></i>${l}</span>`).join("")}</div>
      ${callout}${table}`;
  }

  function renderQuestions() {
    const open = [], done = [], hidden = [];
    state.questions.forEach(q => {
      const st = qStatus[qId(q)];
      (st === "hidden" ? hidden : st === "done" ? done : open).push(q);
    });
    const list = [...open, ...done, ...(state.showHiddenQ ? hidden : [])];
    $("#qHint").innerHTML = `${open.length} ubesvart · ${done.length} tatt` +
      (hidden.length ? ` · <button class="linkbtn" id="qShowHidden">${state.showHiddenQ ? "skjul" : "vis"} ${hidden.length} skjult${hidden.length > 1 ? "e" : ""}</button>` : "");
    if (!list.length) {
      $("#qList").innerHTML = `<div class="q-empty">Ingen spørsmål ennå. Spørsmål som skrives i skjemaet dukker opp her.</div>`;
      return;
    }
    $("#qList").innerHTML = list.map(q => {
      const id = qId(q), st = qStatus[id];
      const who = q.group >= 0 ? `${swatch(q.group)}${esc(C.groups[q.group].label)}` : "";
      return `<div class="q-card ${st === "done" ? "done" : ""} ${st === "hidden" ? "hidden-q" : ""}">
        <div class="q-text">${esc(q.text)}</div>
        <div class="q-foot"><span class="who">${who}</span>
          <button data-q="${esc(id)}" data-act="done">${st === "done" ? "Angre" : "Tatt ✓"}</button>
          <button data-q="${esc(id)}" data-act="hidden">${st === "hidden" ? "Vis igjen" : "Skjul"}</button>
        </div></div>`;
    }).join("");
  }

  function render() {
    renderLegend();
    document.querySelectorAll(".view").forEach(v => v.classList.toggle("active", v.id === "view-" + state.view));
    if (state.view === "overview") renderOverview();
    if (state.view === "detail") renderDetail();
    if (state.view === "questions") renderQuestions();
    const openQ = state.questions.filter(q => !qStatus[qId(q)]).length;
    $("#qCount").textContent = openQ ? `(${openQ})` : "";
    document.body.classList.toggle("hidden-results", state.hidden && state.view !== "qr" && state.view !== "questions");
    $("#veil").style.display = state.hidden && state.view !== "qr" && state.view !== "questions" ? "flex" : "";
    document.querySelectorAll("footer [data-go]").forEach(b => b.classList.toggle("on", b.dataset.go === state.view));
    $("#sortBtn").firstChild.textContent = state.sortByGap ? "Sorter: uenighet" : "Sorter: rekkefølge";
    $("#hideBtn").classList.toggle("on", state.hidden);
    $("#tableBtn").classList.toggle("on", state.showTable);
    $("#pauseBtn").classList.toggle("on", state.paused);
    $("#pauseBtn").firstChild.textContent = state.paused ? "Fortsett" : "Pause";
    $("#allBtn").classList.toggle("on", state.showAll);
    $("#allBtn").firstChild.textContent = state.showAll ? "Vis snitt" : "Vis alle svar";
    $("#tableBtn").hidden = state.view !== "detail";
    const t = state.lastOk ? state.lastOk.toLocaleTimeString("no-NO") : "–";
    $("#statusText").textContent = state.error ? state.error : `${state.rows.length} svar · oppdatert ${t}` + (state.missingCols ? ` · ${state.missingCols} utsagn ikke funnet i regnearket` : "");
    if (state.paused && !state.error) $("#statusText").textContent = `PAUSET · ${state.rows.length} svar · trykk P for å fortsette`;
    $("#liveDot").classList.toggle("err", !!state.error);
    $("#liveDot").classList.toggle("paused", state.paused);
    $("#demoTag").hidden = !DEMO;
  }

  /* ---------- navigation ---------- */
  function go(view, i) {
    state.view = view;
    if (i != null) state.current = (i + C.statements.length) % C.statements.length;
    const hash = view === "detail" ? "utsagn-" + (state.current + 1) : view === "overview" ? "oversikt" : view === "questions" ? "sporsmal" : "qr";
    if (location.hash !== "#" + hash) history.replaceState(null, "", "#" + hash);
    render();
  }
  function step(d) {
    if (state.view !== "detail") { go("detail", d > 0 ? order()[0].i : order()[order().length - 1].i); return; }
    const list = order().map(s => s.i);
    const pos = list.indexOf(state.current);
    go("detail", list[(pos + d + list.length) % list.length]);
  }
  function fromHash() {
    const h = location.hash.slice(1);
    const m = h.match(/^utsagn-(\d+)$/);
    if (m) go("detail", parseInt(m[1], 10) - 1);
    else if (h === "oversikt") go("overview");
    else if (h === "sporsmal") go("questions");
    else go("qr");
  }

  document.addEventListener("click", (e) => {
    const card = e.target.closest(".card");
    if (card) return go("detail", +card.dataset.i);
    const qb = e.target.closest("[data-q]");
    if (qb) {
      const id = qb.dataset.q, act = qb.dataset.act;
      if (qStatus[id] === act) delete qStatus[id]; else qStatus[id] = act;
      saveQ(); return render();
    }
    if (e.target.id === "qShowHidden") { state.showHiddenQ = !state.showHiddenQ; return render(); }
    const b = e.target.closest("[data-go]");
    if (b) return go(b.dataset.go);
  });
  $("#miniQr").onclick = () => go("qr");
  $("#prev").onclick = () => step(-1);
  $("#next").onclick = () => step(1);
  $("#sortBtn").onclick = () => { state.sortByGap = !state.sortByGap; render(); };
  $("#hideBtn").onclick = () => { state.hidden = !state.hidden; render(); };
  $("#allBtn").onclick = () => { state.showAll = !state.showAll; render(); };
  function togglePause() { state.paused = !state.paused; if (!state.paused) refresh(true); render(); }
  $("#pauseBtn").onclick = togglePause;
  $("#tableBtn").onclick = () => { state.showTable = !state.showTable; render(); };
  document.addEventListener("keydown", (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "?" || e.key === "+") { go("questions"); return; }
    const k = e.key.toLowerCase();
    if (k === "arrowright" || k === " " || k === "pagedown") { e.preventDefault(); step(1); }
    else if (k === "arrowleft" || k === "pageup") { e.preventDefault(); step(-1); }
    else if (k === "q") go("qr");
    else if (k === "o" || k === "escape") go("overview");
    else if (k === "s") { state.sortByGap = !state.sortByGap; render(); }
    else if (k === "h") { state.hidden = !state.hidden; render(); }
    else if (k === "a") { state.showAll = !state.showAll; render(); }
    else if (k === "t") { state.showTable = !state.showTable; render(); }
    else if (k === "r") refresh(true);
    else if (k === "p") togglePause();
    else if (k === "f") toggleFullscreen();
  });
  window.addEventListener("hashchange", fromHash);

  /* fullscreen (with Safari prefix) */
  const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
  function toggleFullscreen() {
    const d = document, el = d.documentElement;
    try {
      if (fsEl()) (d.exitFullscreen || d.webkitExitFullscreen).call(d);
      else {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        const r = req && req.call(el);
        if (r && r.catch) r.catch(() => {});
      }
    } catch (_) { /* fullscreen not allowed here */ }
  }
  function syncFsBtn() {
    const on = !!fsEl();
    $("#fsBtn").firstChild.textContent = on ? "⛶ Avslutt fullskjerm" : "⛶ Fullskjerm";
    $("#fsBtn").classList.toggle("on", on);
  }
  $("#fsBtn").onclick = toggleFullscreen;
  document.addEventListener("fullscreenchange", syncFsBtn);
  document.addEventListener("webkitfullscreenchange", syncFsBtn);

  /* tooltip */
  const tip = $("#tip");
  document.addEventListener("mousemove", (e) => {
    const t = e.target.closest("[data-tip]");
    if (!t) { tip.style.display = "none"; return; }
    const [a, b] = t.dataset.tip.split("|");
    tip.innerHTML = `<b>${esc(a)}</b><span>${esc(b)}</span>`;
    tip.style.display = "block";
    const r = tip.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + "px";
    tip.style.top = Math.max(8, e.clientY - r.height - 12) + "px";
  });

  /* ---------- data loop ---------- */
  let busy = false;
  async function refresh(force) {
    if (busy || (state.paused && !force)) return; busy = true;
    try {
      if (DEMO) {
        if (!demoRows.length) demoAdd(38);
        else if (demoRows.length < 160) demoAdd(Math.floor(Math.random() * 3));
        setQuestions(demoRows);
        state.rows = demoRows.slice();
      } else {
        state.rows = await fetchSheet();
      }
      state.error = null; state.lastOk = new Date();
    } catch (err) {
      state.error = "Feil: " + (err && err.message ? err.message : "kunne ikke hente svar") + " – prøver igjen";
    } finally {
      busy = false;
      computeStats(); render();
    }
  }

  renderQR();
  computeStats();
  fromHash();
  refresh();
  setInterval(refresh, Math.max(2, C.refreshSeconds) * 1000);
  // Browsers slow down timers in background tabs; fetch at once when the screen is shown again.
  document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
})();
</script>
</body>
</html>
